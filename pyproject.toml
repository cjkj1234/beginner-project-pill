[project]
name = "pill-detect"
version = "0.1.0"
description = "YOLO11x 기반 경구약제(알약) 객체 탐지 — 3-Phase fine-tuning, EMA, WBF 앙상블"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "albumentations>=2.0.8",
    "matplotlib>=3.10.9",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "numpy>=1.24.0",
    "torch>=2.12.0",
    "torchmetrics[detection]>=1.8.2",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.51",
    "kagglehub>=1.0.1",
    "kaggle>=2.1.2",
    "iterative-stratification>=0.1.9",
    "ensemble-boxes>=1.0.9",
    "tqdm>=4.66.0",
    "wandb>=0.19.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
]

# 서빙용 ONNX 내보내기 (scripts/export_onnx.py): uv sync --group export
export = [
    "onnx>=1.16.0",
    "onnxruntime>=1.20.0",
]

[tool.uv]
default-groups = ["dev"]
